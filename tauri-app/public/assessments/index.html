        {prompt:"I was satisfied with my sleep", options:[["Very much",1],["Quite a bit",2],["Somewhat",3],["A little bit",4],["Not at all",5]]},
        {prompt:"I got enough sleep", options:[["Very much",1],["Quite a bit",2],["Somewhat",3],["A little bit",4],["Not at all",5]]},
        {prompt:"I had a hard time falling asleep", options:[["Not at all",1],["A little bit",2],["Somewhat",3],["Quite a bit",4],["Very much",5]]},
        {prompt:"I had trouble staying asleep", options:[["Not at all",1],["A little bit",2],["Somewhat",3],["Quite a bit",4],["Very much",5]]},
        {prompt:"I had trouble sleeping", options:[["Not at all",1],["A little bit",2],["Somewhat",3],["Quite a bit",4],["Very much",5]]},
        {prompt:"I had a hard time getting to sleep", options:[["Not at all",1],["A little bit",2],["Somewhat",3],["Quite a bit",4],["Very much",5]]}
      ],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const severity=total<=16?"Mild or no sleep disturbance (8-16)":total<=25?"Moderate sleep disturbance (17-25)":"Severe sleep disturbance (26-40)";
        return {score:`Raw Score: ${total}/40`,severity,flag:total>=17?"Moderate to severe sleep disturbance reported. Evaluate insomnia, sleep apnea, mood, and circadian factors.":"",total};
      }
    },
    psc17:{
      title:"Pediatric Symptom Checklist-17 (PSC-17)",
      purpose:"Brief pediatric and adolescent behavioral health screener assessing Internalizing, Externalizing, and Attention concerns.",
      instructions:"Select how often each behavior occurs for the child/adolescent (parent-report or youth self-report).",
      timeframe:"Past 30 days",
      items:[
        "[Internalizing] Feels sad, unhappy",
        "[Internalizing] Feels hopeless",
        "[Internalizing] Is down on self",
        "[Internalizing] Seems to be having less fun",
        "[Internalizing] Worries a lot",
        "[Attention] Fidgets, unable to sit still",
        "[Attention] Daydreams too much",
        "[Attention] Has trouble paying attention",
        "[Attention] Is distractible, easily distracted",
        "[Attention] Has trouble concentrating in class",
        "[Externalizing] Fights with other children",
        "[Externalizing] Does not listen to rules",
        "[Externalizing] Does not understand other people's feelings",
        "[Externalizing] Teases others",
        "[Externalizing] Blames others for mistakes",
        "[Externalizing] Takes things that do not belong to them",
        "[Externalizing] Refuses to share"
      ],
      options:[["Never",0],["Sometimes",1],["Often",2]],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const intScore=values.slice(0,5).reduce((a,b)=>a+b,0);
        const attScore=values.slice(5,10).reduce((a,b)=>a+b,0);
        const extScore=values.slice(10,17).reduce((a,b)=>a+b,0);
        const subFlags=[];
        if(intScore>=5) subFlags.push(`Internalizing subscale elevated (${intScore}/10, Cutoff ≥ 5)`);
        if(attScore>=7) subFlags.push(`Attention subscale elevated (${attScore}/10, Cutoff ≥ 7)`);
        if(extScore>=7) subFlags.push(`Externalizing subscale elevated (${extScore}/14, Cutoff ≥ 7)`);
        const overallPositive=total>=15;
        const severity=overallPositive?`Positive pediatric screen (Total: ${total}/34, Cutoff ≥ 15)`:`Negative screen (Total: ${total}/34, Cutoff < 15)`;
        const flag=subFlags.length>0?`Elevated subscale(s): ${subFlags.join("; ")}. Further developmental and psychological evaluation recommended.`:"";
        return {score:`Total: ${total}/34 (Int: ${intScore}, Att: ${attScore}, Ext: ${extScore})`,severity,flag,total};
      }
    },
    crafft21:{
      title:"CRAFFT 2.1 Adolescent Substance Screener",
      purpose:"Behavioral health screening tool for alcohol and substance use risk in adolescents and young adults (ages 12-21).",
      instructions:"Answer Yes or No regarding alcohol, marijuana, or drug use over the past 12 months.",
      timeframe:"Past 12 months",
      items:[
        "[C - Car] Driven or ridden in a Car driven by someone (including self) who was high or using alcohol/drugs?",
        "[R - Relax] Ever use alcohol or drugs to Relax, feel better about yourself, or fit in?",
        "[A - Alone] Ever use alcohol or drugs while by yourself, Alone?",
        "[F - Forget] Ever Forget things you did while using alcohol or drugs?",
        "[F - Family/Friends] Do Family or Friends ever tell you to cut down on drinking or drug use?",
        "[T - Trouble] Ever gotten into Trouble while using alcohol or drugs?"
      ],
      options:[["No",0],["Yes",1]],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const carRisk=values[0]===1;
        const severity=total>=2?"Positive screen for adolescent substance use disorder risk (Score ≥ 2)":total===1?"Low risk / Caution (Score 1)":"Low risk (Score 0)";
        const flags=[];
        if(carRisk) flags.push("Riding/driving with impaired driver endorsed. Provide immediate driving risk counseling and safety planning.");
        if(total>=2) flags.push("Score ≥ 2 indicates significant risk for substance use disorder. Brief intervention (e.g. FRAMES/MI) and diagnostic evaluation recommended.");
        return {score:`${total}/6`,severity,flag:flags.join(" "),total};
      }
    },
    gds15:{
      title:"Geriatric Depression Scale (GDS-15)",
      purpose:"Depression screening scale validated for older adults, omitting physical/somatic items overlapping with physical aging.",
      instructions:"Answer Yes or No based on how the client felt over the past week.",
      timeframe:"Past week",
      customItems:[
        {prompt:"Are you basically satisfied with your life?", options:[["Yes",0],["No",1]]},
        {prompt:"Have you dropped many of your activities and interests?", options:[["No",0],["Yes",1]]},
        {prompt:"Do you feel that your life is empty?", options:[["No",0],["Yes",1]]},
        {prompt:"Do you often get bored?", options:[["No",0],["Yes",1]]},
        {prompt:"Are you in good spirits most of the time?", options:[["Yes",0],["No",1]]},
        {prompt:"Are you afraid that something bad is going to happen to you?", options:[["No",0],["Yes",1]]},
        {prompt:"Do you feel happy most of the time?", options:[["Yes",0],["No",1]]},
        {prompt:"Do you often feel helpless?", options:[["No",0],["Yes",1]]},
        {prompt:"Do you prefer to stay at home, rather than going out and doing new things?", options:[["No",0],["Yes",1]]},
        {prompt:"Do you feel you have more problems with memory than most?", options:[["No",0],["Yes",1]]},
        {prompt:"Do you think it is wonderful to be alive now?", options:[["Yes",0],["No",1]]},
        {prompt:"Do you feel pretty worthless the way you are now?", options:[["No",0],["Yes",1]]},
        {prompt:"Do you feel full of energy?", options:[["Yes",0],["No",1]]},
        {prompt:"Do you feel that your situation is hopeless?", options:[["No",0],["Yes",1]]},
        {prompt:"Do you think that most people are better off than you are?", options:[["No",0],["Yes",1]]}
      ],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const severity=total<=4?"Normal / No depression (0-4)":total<=8?"Mild depression (5-8)":total<=11?"Moderate depression (9-11)":"Severe depression (12-15)";
        return {score:`${total}/15`,severity,flag:total>=5?"Score of 5 or higher suggests geriatric depression. Comprehensive clinical evaluation indicated.":"",total};
      }
    },
    ucla3:{
      title:"UCLA Loneliness Scale (3-Item Short Form)",
      purpose:"Brief screener measuring loneliness and social isolation, a major social determinant of mental health.",
      instructions:"Indicate how often the client feels each experience.",
      timeframe:"Current / General",
      items:[
        "How often do you feel that you lack companionship?",
        "How often do you feel left out?",
        "How often do you feel isolated from others?"
      ],
      options:[["Hardly ever",1],["Some of the time",2],["Often",3]],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const severity=total<=5?"Low loneliness / Well-connected (3-5)":"Moderate to high loneliness / Social isolation risk (6-9)";
        return {score:`${total}/9`,severity,flag:total>=6?"Significant social isolation or loneliness reported. Consider evaluating community connections, support systems, and social determinants of health.":"",total};
      }
    },
    ad8:{
      title:"AD8 Dementia Screening Interview",
      purpose:"Brief 8-item informant or self-report screener to differentiate non-demented aging from early cognitive impairment.",
      instructions:"Indicate whether there has been a change in memory or thinking abilities over the past few years.",
      timeframe:"Past few years",
      items:[
        "Problems with judgment (e.g. problems making decisions, bad financial decisions, safety concerns)?",
        "Less interest in hobbies, activities, or social pursuits?",
        "Repeats the same things over and over (questions, stories, or statements)?",
        "Trouble learning how to use a tool, appliance, or gadget (e.g. TV remote, microwave, phone)?",
        "Forgets correct month or year?",
        "Trouble handling complicated financial affairs (e.g. balancing checkbook, paying bills)?",
        "Trouble remembering appointments?",
        "Daily problems with thinking and/or memory?"
      ],
      options:[["No change",0],["Yes, a change",1]],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const severity=total>=2?"Positive screen for cognitive impairment (Score ≥ 2)":"Normal cognitive screen (Score 0-1)";
        const flag=total>=2?"Score ≥ 2 suggests cognitive decline. Formal medical, neurological, and neuropsychological evaluation recommended.":"";
        return {score:`${total}/8`,severity,flag,total};
      }
    }
  };

  function binaryHtml(name){
    return `<div class="options-grid"><label class="option-tile"><input type="radio" name="${name}" value="yes"><span>Yes</span></label><label class="option-tile"><input type="radio" name="${name}" value="no"><span>No</span></label></div>`;
  }

  function questionHtml(key, index, prompt, options, selected){
    let formattedPrompt = esc(prompt);
    if(prompt.startsWith('[')){
      const match = prompt.match(/^\[(.*?)\]\s*(.*)$/);
      if(match){
        if(screenShareActive){
          formattedPrompt = esc(match[2]);
        } else {
          formattedPrompt = `<span style="display:inline-block;background:var(--bg-subtle);color:var(--text-muted);border:1px solid var(--border-color);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:6px">${esc(match[1])}</span>` + esc(match[2]);
        }
      }
    }
    return `<div class="question-card">
      <span class="q-number">Item ${index+1}</span>
      <div class="qtext">${formattedPrompt}</div>
      <div class="options-grid">
        ${options.map((opt, optIdx) => {
          const isChecked = selected === opt[1];
          const isAsrsShaded = (key === "asrs6" && ((index < 3 && optIdx >= 2) || (index >= 3 && optIdx >= 3)));
          const shadedClass = isAsrsShaded ? "shaded-option" : "";
          return `<label class="option-tile ${shadedClass}">
            <input type="radio" name="${key}_q${index+1}" value="${opt[1]}" ${isChecked ? "checked" : ""}>
            <span>${esc(opt[0])}${isAsrsShaded ? " ⚡" : ""}</span>
          </label>`;
        }).join("")}
      </div>
    </div>`;
  }

  function getState(key){
    if(!responseState[key]) responseState[key] = { items: [], extra: {} };
    return responseState[key];
  }

  function renderHeader(key, title, purpose, instructions, timeframe){
    const source = sourceLibrary[key];
    const badgeText = source ? source.status : "";
    const badgeClass = "source-badge";
    const timeframeHtml = timeframe ? `<div class="timeframe-badge">⏱️ TIMEFRAME: ${esc(timeframe)}</div>` : "";
    const infoLink = source && source.infoUrl ? `<a href="${source.infoUrl}" target="_blank" rel="noopener">Additional Citation Info</a>` : "";
    const sourceRow = source ? `<div class="source-row"><span class="${badgeClass}">✓ ${esc(badgeText)}</span><a href="${source.url}" target="_blank" rel="noopener">Source / Official PDF</a>${infoLink}</div>` : "";
    return `<div class="assessment-header">
      ${timeframeHtml}
      <h2 class="assessment-title">${esc(title)}</h2>
      <p class="assessment-purpose">${esc(purpose)}</p>
      ${sourceRow}
    </div>
    ${instructions ? `<div class="instruction-box">💡 <strong>Administration Instructions:</strong> ${esc(instructions)}</div>` : ""}`;
  }

  function renderGenericScale(key, scale){
    const state = getState(key);
    let html = renderHeader(key, scale.title, scale.purpose, scale.instructions, scale.timeframe);

    if(scale.traumaGate){
      const exp = state.extra.traumaExposure || "";
      html += `<div class="question-card" style="border-left: 4px solid var(--accent-teal);">
        <div class="qtext">Criterion A Trauma Gate: Has the client experienced or witnessed a traumatic event involving actual or threatened death, serious injury, or sexual violence?</div>
        ${binaryHtml("traumaExposure")}
      </div>`;
      if(exp === "no"){
        html += `<div class="question-card"><div class="qtext">Screener complete (Trauma Criterion A negative). PCL-5 / PC-PTSD-5 items skipped.</div></div>`;
        $("assessmentArea").innerHTML = html;
        bindTraumaGate(key, scale);
        updateSummary();
        return;
      }
    }

    const items = scale.customItems || scale.items;
    items.forEach((item, index) => {
      if(scale.customItems){
        html += questionHtml(key, index, item.prompt, item.options, state.items[index]);
      } else {
        html += questionHtml(key, index, item, scale.options, state.items[index]);
      }
    });

    $("assessmentArea").innerHTML = html;
    if(scale.traumaGate) bindTraumaGate(key, scale);

    items.forEach((_, index) => {
      document.querySelectorAll(`[name="${key}_q${index+1}"]`).forEach(input => {
        input.addEventListener("change", e => {
          state.items[index] = Number(e.target.value);
          updateSummary();
        });
      });
    });

    updateSummary();
  }

  function bindTraumaGate(key, scale){
    const state = getState(key);
    document.querySelectorAll('[name="traumaExposure"]').forEach(input => {
      if(state.extra.traumaExposure === input.value) input.checked = true;
      input.addEventListener("change", e => {
        state.extra.traumaExposure = e.target.value;
        renderGenericScale(key, scale);
      });
    });
  }

  function renderCssrs(){
    const key = "cssrs";
    const state = getState(key);
    const q = [
      "Have you wished you were dead or wished you could go to sleep and not wake up?",
      "Have you actually had any thoughts about killing yourself?",
      "Have you been thinking about how you might do this?",
      "Have you had these thoughts and had some intention of acting on them?",
      "Have you started to work out or worked out the details of how to kill yourself? Did you intend to carry out this plan?",
      "Have you done anything, started to do anything, or prepared to do anything to end your life?"
    ];
    let html = renderHeader(key, "Columbia-Suicide Severity Rating Scale (C-SSRS)", "Brief recent suicidal ideation and behavior screen.", "CLINICAL ADMINISTRATION NOTE: The C-SSRS is a semi-structured interview requiring direct clinician probing. Always ask questions 1 and 2. If question 2 is yes, ask questions 3 through 5. Always ask question 6. Probe to differentiate passive thoughts from active intent and plan.", "Past month; behavior lifetime and past 3 months");
    html += `<div class="cssrs-table">`;
    q.forEach((text, index) => {
      const riskClass = index < 2 ? "yellow" : index === 2 || index === 5 ? "orange" : "red";
      html += `<div class="cssrs-row">
        <div class="cssrs-cell-q"><div class="qtext">${index+1}. ${esc(text)}</div>${index===5 ? `<div class="qsub">Examples include an actual attempt, an interrupted or aborted attempt, or preparatory behavior.</div>`:""}</div>
        <div class="cssrs-cell-ans ${riskClass}">
          <select id="cssrs_q${index+1}"><option value=""></option><option value="yes">YES</option><option value="no">NO</option></select>
        </div>
      </div>`;
    });
    html += `</div>
    <div id="q6RecentWrap" class="question-card" style="margin-top: 14px;">
      <div class="qtext">If question 6 is yes, was this within the past 3 months?</div>
      ${binaryHtml("cssrs_q6recent")}
    </div>
    <div class="risk-line">
      <strong>Computed Risk Level:</strong>
      <div id="cssrsRiskPill" class="risk-pill">Not set</div>
      <div id="cssrsRiskNote" style="font-size: 13px; font-weight: 600;"></div>
    </div>`;

    $("assessmentArea").innerHTML = html;
    for(let i=0; i<6; i++){
      const node = $(`cssrs_q${i+1}`);
      node.value = state.items[i] || "";
      node.addEventListener("change", e => { state.items[i] = e.target.value; applyCssrsSkip(); updateSummary(); });
    }
    document.querySelectorAll(`[name="cssrs_q6recent"]`).forEach(input => {
      if(state.extra.q6recent === input.value) input.checked = true;
      input.addEventListener("change", e => { state.extra.q6recent = e.target.value; updateSummary(); });
    });
    applyCssrsSkip();
    updateSummary();
  }

  function applyCssrsSkip(){
    const state = getState("cssrs");
    const q2 = state.items[1];
    [2,3,4].forEach(i => {
      const node = $(`cssrs_q${i+1}`);
      if(q2 === "no"){
        state.items[i] = "no";
        node.value = "no";
        node.disabled = true;
      } else {
        node.disabled = false;
      }
    });
    const q6Wrap = $("q6RecentWrap");
    if(state.items[5] === "yes"){
      q6Wrap.classList.remove("hidden");
    } else {
      q6Wrap.classList.add("hidden");
      state.extra.q6recent = "";
    }
  }

  function calculateCssrs(){
    const s = getState("cssrs");
    const answers = s.items;
    if(answers.length < 6) return null;
    for(let i=0; i<6; i++){
      if(!answers[i]) return null;
    }
    if(answers[1] === "no"){
      answers[2] = "no"; answers[3] = "no"; answers[4] = "no";
    }
    if(answers[5] === "yes" && !s.extra.q6recent) return null;

    const yes = (idx) => answers[idx-1] === "yes";
    let level = "Low", cls = "low", note = "No recent suicidal ideation reported.";
    if(yes(1)) { level = "Low"; cls = "low"; note = "Passive suicidal ideation endorsed without plan or intent."; }
    if(yes(2)) { level = "Moderate"; cls = "mod"; note = "Active suicidal ideation endorsed without intent or specific plan."; }
    if(yes(3) || (yes(6) && s.extra.q6recent === "no")) { level = "Moderate"; cls = "mod"; note = "Ideation with method or non-recent suicidal behavior."; }
    if(yes(4) || yes(5) || (yes(6) && s.extra.q6recent === "yes")) {
      level = "High"; cls = "high"; note = "Active ideation with intent/plan or recent suicidal behavior (past 3 months).";
    }
    return {
      score: `C-SSRS Risk Level: ${level}`,
      severity: note,
      flag: level === "High" ? "HIGH SUICIDE RISK: Immediate safety planning, clinical consultation, and risk management protocol required." : "",
      level, cls, note
    };
  }

  function renderLibrary(){
    let html = `<div class="assessment-header">
      <h2 class="assessment-title">Source Library & License Compliance</h2>
      <p class="assessment-purpose">Official references, open-access status, and distribution terms for all 30 assessment instruments.</p>
    </div>
    <div class="library-grid">`;

    Object.keys(sourceLibrary).forEach(key => {
      const item = sourceLibrary[key];
      html += `<div class="library-item">
        <h4>${esc(item.name)}</h4>
        <p><strong>Status:</strong> ${esc(item.status)}</p>
        <p>${esc(item.note)}</p>
        <div style="margin-top:8px;"><a href="${item.url}" target="_blank" rel="noopener" style="font-weight:700; color:var(--accent-teal);">Open Official PDF / Reference →</a></div>
      </div>`;
    });
    html += `</div>`;
    $("assessmentArea").innerHTML = html;
    setResult(null, "Reference Library Active");
    $("summary").value = "Source library active. Select a clinical scale to begin assessment.";
  }

  function renderCurrent(){
    currentKey = $("assessmentSelect").value;
    $("status").textContent = "";
    if(currentKey === "library") return renderLibrary();
    if(currentKey === "cssrs") return renderCssrs();
    if(scales[currentKey]) return renderGenericScale(currentKey, scales[currentKey]);
  }

  function isCompleteGeneric(key, scale){
    const s = getState(key);
    if(scale.traumaGate && s.extra.traumaExposure !== "yes") return Boolean(s.extra.traumaExposure);
    const expected = (scale.customItems || scale.items).length;
    if(s.items.length < expected) return false;
    for(let i=0; i<expected; i++) if(s.items[i] === undefined || s.items[i] === null || s.items[i] === "") return false;
    return true;
  }

  function setResult(result, override){
    const flag = $("flagText");
    if(!result){
      $("scoreText").textContent = override || "Incomplete";
      $("severityText").textContent = override ? "" : "Complete all required fields.";
      flag.classList.add("hidden");
      flag.textContent = "";
      return;
    }
    $("scoreText").textContent = result.score;
    $("severityText").textContent = result.severity;
    if(result.flag){
      flag.textContent = result.flag;
      flag.classList.remove("hidden");
      const isHighRisk = (currentKey === "cssrs" && result.level === "High") ||
                         (currentKey === "epds" && getState("epds").items[9] > 0) ||
                         (currentKey === "phq9" && getState("phq9").items[8] > 0) ||
                         (currentKey === "dsm5level1" && getState("dsm5level1").items[10] > 0) ||
                         (currentKey === "crafft21" && getState("crafft21").items[0] === 1);
      flag.classList.toggle("high", isHighRisk);
    } else {
      flag.textContent = "";
      flag.classList.add("hidden");
      flag.classList.remove("high");
    }
    if(currentKey === "cssrs" && $("cssrsRiskPill")){
      const pill = $("cssrsRiskPill");
      pill.textContent = result.level;
      pill.className = `risk-pill ${result.cls}`;
      $("cssrsRiskNote").textContent = result.note;
    }
  }

  function updateSummary(){
    if(currentKey === "library") return;
    let result = null, complete = false, definition = null;

    if(currentKey === "cssrs"){
      result = calculateCssrs();
      complete = Boolean(result);
    } else if(scales[currentKey]){
      definition = scales[currentKey];
      complete = isCompleteGeneric(currentKey, definition);
      if(complete) result = definition.calculate(getState(currentKey).items, getState(currentKey).extra);
    }

    if(!complete){
      setResult(null);
      $("summary").value = "Complete all required fields to generate an EMR summary.";
      return;
    }

    setResult(result);
    $("summary").value = buildSummaryText(result, definition);
  }

  function buildSummaryText(result, definition){
    const adminDate = $("adminDate").value || "Unspecified";
    const includeResponses = $("includeResponses").checked;
    const includeInterpretation = $("includeInterpretation").checked;

    let title = currentKey === "cssrs" ? "Columbia-Suicide Severity Rating Scale (C-SSRS)" : definition.title;
    let lines = [];
    lines.push(`CLINICAL ASSESSMENT SUMMARY: ${title.toUpperCase()}`);
    lines.push(`Administration Date: ${adminDate}`);
    lines.push(`Score / Result: ${result.score}`);
    lines.push(`Severity / Interpretation: ${result.severity}`);

    if(includeResponses){
      lines.push("");
      lines.push("ITEM RESPONSES:");
      if(currentKey === "cssrs"){
        const qText = [
          "1. Wish to be dead", "2. Suicidal thoughts", "3. Thoughts with method",
          "4. Intent to act", "5. Specific plan and intent", "6. Suicidal behavior"
        ];
        const state = getState("cssrs");
        qText.forEach((t, i) => lines.push(`- ${t}: ${state.items[i] ? state.items[i].toUpperCase() : "N/A"}`));
        if(state.items[5] === "yes") lines.push(`  - Behavior in past 3 months: ${state.extra.q6recent ? state.extra.q6recent.toUpperCase() : "N/A"}`);
      } else {
        const state = getState(currentKey);
        if(definition.traumaGate) lines.push(`- Criterion A Trauma Gate: ${state.extra.traumaExposure ? state.extra.traumaExposure.toUpperCase() : "N/A"}`);
        const items = definition.customItems || definition.items;
        items.forEach((item, index) => {
          const prompt = definition.customItems ? item.prompt : item;
          const val = state.items[index];
          let label = "Unanswered";
          if(definition.customItems){
            const found = item.options.find(o => o[1] === val);
            if(found) label = `${found[0]} (${val})`;
          } else {
            const found = definition.options.find(o => o[1] === val);
            if(found) label = `${found[0]} (${val})`;
          }
          lines.push(`- ${prompt}: ${label}`);
        });
      }
    }

    if(includeInterpretation && result.flag){
      lines.push("");
      lines.push(`CLINICAL ALERT / NOTE: ${result.flag}`);
    }
    lines.push("");
    lines.push("This screening result was interpreted with the clinical interview and does not independently establish or exclude a diagnosis.");
    return lines.join("\n");
  }

  function clearCurrent(){
    if(currentKey !== "library") delete responseState[currentKey];
    $("status").textContent = "Current assessment cleared.";
    renderCurrent();
  }

  function clearEverything(){
    Object.keys(responseState).forEach(k => delete responseState[k]);
    $("status").textContent = "All entered information cleared.";
    renderCurrent();
  }

  async function copySummary(){
    const text = $("summary").value;
    if(!text || text.startsWith("Complete all")){
      $("status").textContent = "Complete the assessment before copying.";
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      $("status").textContent = "✓ Summary copied to clipboard!";
    } catch(err) {
      $("summary").focus();
      $("summary").select();
      $("status").textContent = "Clipboard blocked. Text selected (press Ctrl/Cmd+C).";
    }
  }

  let screenShareActive = false;
  function toggleScreenShare(){
    screenShareActive = !screenShareActive;
    $("appContainer").classList.toggle("screen-share-mode", screenShareActive);
    const btn = $("screenShareBtn");
    btn.classList.toggle("active", screenShareActive);
    btn.innerHTML = screenShareActive ? "<span>Exit Screen Share</span>" : "<span>Screen Share mode</span>";
    $("status").textContent = screenShareActive ? "Screen Share mode active." : "Exited Screen Share mode.";
    renderCurrent();
  }

  /* Category Filter Pill Logic */
  const categoryMap = {
    all: null,
    dsm5: ["dsm5level1", "dsm5level2_depression", "dsm5level2_anxiety", "dsm5level2_anger", "dsm5level2_mania", "dsm5level2_sleep"],
    broadband: ["phq4", "k6", "dass21", "pq16", "ucla3"],
    mood: ["phq9", "epds", "gds15", "gad7", "phq15", "cssrs"],
    pediatric: ["psc17", "crafft21", "ad8"],
    substance: ["auditc", "cageaid", "dast10", "scoff", "whodas12"]
  };

  document.querySelectorAll(".pill").forEach(pill => {
    pill.addEventListener("click", () => {
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      const cat = pill.dataset.cat;
      const allowed = categoryMap[cat];
      const select = $("assessmentSelect");
      let firstVal = null;

      Array.from(select.options).forEach(opt => {
        if(opt.value === "library") return;
        if(!allowed || allowed.includes(opt.value)){
          opt.style.display = "";
          if(!firstVal) firstVal = opt.value;
        } else {
          opt.style.display = "none";
        }
      });

      if(firstVal){
        select.value = firstVal;
        renderCurrent();
      }
    });
  });

  const now = new Date();
  $("adminDate").value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  $("assessmentSelect").addEventListener("change", renderCurrent);
  $("screenShareBtn").addEventListener("click", toggleScreenShare);
  $("clearBtn").addEventListener("click", clearCurrent);
  $("clearAllBtn").addEventListener("click", clearEverything);
  $("copyBtn").addEventListener("click", copySummary);
  $("selectBtn").addEventListener("click", () => {
    $("summary").focus();
    $("summary").select();
    $("status").textContent = "Summary selected.";
  });
  $("adminDate").addEventListener("change", updateSummary);
  $("includeResponses").addEventListener("change", updateSummary);
  $("includeInterpretation").addEventListener("change", updateSummary);

  renderCurrent();
})();
</script>
</body>
</html>
