<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SmartEMR Assessment Suite</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-color: #cbd5e1;
      --border-focus: #0284c7;

      --primary-dark: #0f172a;
      --accent-teal: #0284c7;
      --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      --accent-soft: #f0f9ff;
      --accent-border: #bae6fd;

      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;

      --severity-green: #059669;
      --severity-green-bg: #ecfdf5;
      --severity-blue: #0284c7;
      --severity-blue-bg: #f0f9ff;
      --severity-yellow: #d97706;
      --severity-yellow-bg: #fffbeb;
      --severity-orange: #ea580c;
      --severity-orange-bg: #fff7ed;
      --severity-red: #dc2626;
      --severity-red-bg: #fef2f2;

      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 14px -2px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.12);
      --shadow-glow: 0 0 20px rgba(2, 132, 199, 0.2);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Top App Navigation Bar */
    .app-header {
      background: var(--primary-dark);
      color: #ffffff;
      padding: 16px 24px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin: 0;
      color: #ffffff;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(255,255,255,0.12);
      color: #7dd3fc;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      color: #f1f5f9;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-header:hover {
      background: rgba(255,255,255,0.16);
      color: #ffffff;
    }
    .btn-header.active {
      background: var(--accent-teal);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Main Container */
    .app-container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
    }

    /* Assessment Selection Bar */
    .controls-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--bg-subtle);
      scrollbar-width: thin;
    }
    .pill {
      background: var(--bg-subtle);
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }
    .pill:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }
    .pill.active {
      background: var(--primary-dark);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
    }

    .selector-grid {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
    }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    select, input[type="text"], input[type="date"] {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #ffffff;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition);
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn {
      height: 44px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: var(--transition);
      border: 1.5px solid transparent;
    }
    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-outline {
      background: #ffffff;
      border-color: var(--border-color);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: var(--bg-subtle);
      border-color: #cbd5e1;
    }

    .screen-share-banner {
      display: none;
      background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      margin-top: 14px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.2);
    }

    /* Split Workspace Layout */
    .layout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 20px;
      align-items: start;
    }

    .panel-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 24px;
    }

    .sticky-panel {
      position: sticky;
      top: 84px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--bg-subtle);
    }

    /* Assessment Header Styling */
    .assessment-header {
      margin-bottom: 18px;
    }
    .assessment-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      margin: 0 0 8px;
      letter-spacing: -0.4px;
    }
    .assessment-purpose {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0;
    }

    .timeframe-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-dark);
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .instruction-box {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-left: 4px solid var(--accent-teal);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin: 16px 0 20px;
      font-size: 14px;
      font-weight: 600;
      color: #0369a1;
      line-height: 1.55;
    }

    .source-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 13px;
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Question Cards & Radio Option Tiles */
    .question-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 14px;
      transition: var(--transition);
    }
    .question-card:hover {
      border-color: #94a3b8;
      box-shadow: var(--shadow-sm);
    }
    .q-number {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-teal);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .qtext {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .qsub {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }

    .option-tile {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      transition: var(--transition);
      user-select: none;
    }
    .option-tile:hover {
      background: var(--bg-subtle);
      border-color: #94a3b8;
    }
    .option-tile input[type="radio"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #94a3b8;
      border-radius: 50%;
      margin: 0;
      display: grid;
      place-content: center;
      transition: var(--transition);
    }
    .option-tile input[type="radio"]::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transform: scale(0);
      transition: 0.15s transform ease-in-out;
      background-color: #ffffff;
    }
    .option-tile input[type="radio"]:checked {
      background-color: var(--accent-teal);
      border-color: var(--accent-teal);
    }
    .option-tile input[type="radio"]:checked::before {
      transform: scale(1);
    }
    .option-tile:has(input[type="radio"]:checked) {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    /* ASRS v1.1 Shaded Zone Indicator */
    .option-tile.shaded-option {
      background: #fffbeb;
      border-color: #fcd34d;
    }
    .option-tile.shaded-option:has(input[type="radio"]:checked) {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      border-color: #b45309;
      color: #ffffff;
    }

    /* C-SSRS Matrix Table */
    .cssrs-table {
      border: 2px solid var(--primary-dark);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 14px;
    }
    .cssrs-row {
      display: grid;
      grid-template-columns: 1fr 140px;
      border-bottom: 1.5px solid var(--border-color);
    }
    .cssrs-row:last-child { border-bottom: 0; }
    .cssrs-cell-q {
      padding: 14px;
      background: #ffffff;
    }
    .cssrs-cell-ans {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cssrs-cell-ans.yellow { background: var(--severity-yellow-bg); }
    .cssrs-cell-ans.orange { background: var(--severity-orange-bg); }
    .cssrs-cell-ans.red { background: var(--severity-red-bg); }
    .cssrs-cell-ans select {
      height: 38px;
      font-weight: 800;
      text-align: center;
    }

    .risk-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 14px;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
    }
    .risk-pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
    }
    .risk-pill.low { background: var(--severity-yellow); color: #78350f; }
    .risk-pill.mod { background: var(--severity-orange); }
    .risk-pill.high { background: var(--severity-red); }

    /* EMR Summary Side Panel */
    .summary-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .summary-header-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 800;
      margin: 0;
      color: var(--text-main);
    }

    .result-display-box {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .score-value {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-teal);
      margin-bottom: 4px;
    }
    .severity-text {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
    }

    .flag-box {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--severity-yellow-bg);
      border: 1px solid #fde68a;
      color: #92400e;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }
    .flag-box.high {
      background: var(--severity-red-bg);
      border-color: #fca5a5;
      color: #991b1b;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.2);
    }

    .summary-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .summary-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    textarea#summary {
      width: 100%;
      min-height: 320px;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-main);
      background: #ffffff;
      resize: vertical;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .status-msg {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      min-height: 20px;
    }

    /* Screen Share Mode Overrides */
    .app-container.screen-share-mode .layout-grid {
      grid-template-columns: 1fr;
      max-width: 900px;
      margin: 0 auto;
    }
    .app-container.screen-share-mode aside.sticky-panel {
      display: none !important;
    }
    .app-container.screen-share-mode .risk-line {
      display: none !important;
    }
    .app-container.screen-share-mode .screen-share-banner {
      display: block;
    }

    /* Source Library Grid */
    .library-grid {
      display: grid;
      gap: 12px;
    }
    .library-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .library-item h4 {
      margin: 0 0 6px;
      font-size: 16px;
      color: var(--text-main);
    }
    .library-item p {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .hidden { display: none !important; }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-main: #2d3748;
      --bg-surface: #283141;
      --bg-subtle: #232b38;
      --border-color: #4a5568;
      --border-focus: #63b3ed;
      --primary-dark: #1a2533;
      --accent-teal: #63b3ed;
      --accent-gradient: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
      --accent-soft: #334155;
      --accent-border: #4a5568;
      --text-main: #e2e8f0;
      --text-muted: #a0aec0;
      --text-light: #718096;
      --severity-green-bg: #1c3a2e;
      --severity-blue-bg: #243b53;
      --severity-yellow-bg: #4a3a1a;
      --severity-orange-bg: #4a2e1c;
      --severity-red-bg: #4c3030;
    }

    [data-theme="dark"] body {
      background: var(--bg-main);
    }

    [data-theme="dark"] .controls-card,
    [data-theme="dark"] .panel-card,
    [data-theme="dark"] .question-card,
    [data-theme="dark"] .option-tile,
    [data-theme="dark"] .cssrs-cell-q,
    [data-theme="dark"] .library-item,
    [data-theme="dark"] textarea#summary {
      background: var(--bg-surface);
      color: var(--text-main);
    }

    [data-theme="dark"] select,
    [data-theme="dark"] input[type="text"],
    [data-theme="dark"] input[type="date"] {
      background: #4a5568;
      color: var(--text-main);
    }

    [data-theme="dark"] .pill:hover,
    [data-theme="dark"] .btn-outline:hover,
    [data-theme="dark"] .option-tile:hover {
      background: #4a5568;
      color: var(--text-main);
    }

    [data-theme="dark"] .instruction-box {
      color: #bee3f8;
    }

    [data-theme="dark"] .flag-box {
      color: #fbd38d;
    }

    [data-theme="dark"] .flag-box.high {
      color: #fed7d7;
    }

    /* Responsive Adapters */
    @media (max-width: 1024px) {
      .layout-grid { grid-template-columns: 1fr; }
      .sticky-panel { position: static; }
    }
    @media (max-width: 768px) {
      .app-header { padding: 12px 16px; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      .top-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
      .selector-grid { grid-template-columns: 1fr; }
      .meta-row { grid-template-columns: 1fr; }
      .options-grid { grid-template-columns: 1fr; }
      .action-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- App Header Bar -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div>
          <h1 class="brand-title">SmartEMR Assessment Suite</h1>
          <span class="brand-tag">30 Open-Access Clinical Instruments</span>
        </div>
      </div>
      <div class="top-actions">
        <button id="screenShareBtn" class="btn-header" type="button">
          <span>📺</span> <span>Screen Share mode</span>
        </button>
        <button id="clearBtn" class="btn-header" type="button">
          <span>🧹</span> <span>Clear current</span>
        </button>
        <button id="clearAllBtn" class="btn-header" type="button">
          <span>🗑️</span> <span>Clear all</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div id="appContainer" class="app-container">

    <!-- Controls & Selection Card -->
    <div class="controls-card">
      <div class="filter-pills">
        <button class="pill active" data-cat="all">All (30)</button>
        <button class="pill" data-cat="dsm5">DSM-5 Cross-Cutting</button>
        <button class="pill" data-cat="broadband">Transdiagnostic</button>
        <button class="pill" data-cat="mood">Mood & Perinatal</button>
        <button class="pill" data-cat="pediatric">Pediatric & Youth</button>
        <button class="pill" data-cat="substance">Substance & Function</button>
      </div>
      <div class="selector-grid">
        <div>
          <label class="field-label" for="assessmentSelect">Select Assessment Instrument</label>
          <select id="assessmentSelect">
            <optgroup label="DSM-5 Cross-Cutting Measures (Level 1 Broadband & Level 2 In-Depth)">
              <option value="dsm5level1">DSM-5 Level 1 | Adult Broadband Cross-Cutting Measure</option>
              <option value="dsm5level2_depression">DSM-5 Level 2 | Depression (PROMIS Short Form)</option>
              <option value="dsm5level2_anxiety">DSM-5 Level 2 | Anxiety (PROMIS Short Form)</option>
              <option value="dsm5level2_anger">DSM-5 Level 2 | Anger (PROMIS Short Form)</option>
              <option value="dsm5level2_mania">DSM-5 Level 2 | Mania (Altman ASRMS Scale)</option>
              <option value="dsm5level2_sleep">DSM-5 Level 2 | Sleep Disturbance (PROMIS Short Form)</option>
            </optgroup>
            <optgroup label="Transdiagnostic & broadband screeners">
              <option value="phq4">PHQ-4 | Brief 4-item mood & anxiety screener</option>
              <option value="k6">K6 | Psychological Distress Scale</option>
              <option value="dass21">DASS-21 | Depression, Anxiety, & Stress Scales</option>
              <option value="pq16">PQ-16 | Psychosis / Attenuated Psychosis screen</option>
              <option value="ucla3">UCLA-3 | Loneliness & Social Isolation screen</option>
            </optgroup>
            <optgroup label="Core mood, perinatal, and geriatric">
              <option value="phq9">PHQ-9 | Depression</option>
              <option value="epds">EPDS | Perinatal depression</option>
              <option value="gds15">GDS-15 | Geriatric depression screen</option>
              <option value="gad7">GAD-7 | Anxiety</option>
              <option value="phq15">PHQ-15 | Somatic symptoms (Level 2 Somatic)</option>
              <option value="cssrs">C-SSRS Screen Version | Suicide risk</option>
            </optgroup>
            <optgroup label="Pediatric, adolescent & cognitive screening">
              <option value="psc17">PSC-17 | Pediatric Symptom Checklist</option>
              <option value="crafft21">CRAFFT 2.1 | Adolescent substance screen</option>
              <option value="ad8">AD8 | Cognitive impairment / Dementia screen</option>
            </optgroup>
            <optgroup label="Trauma and differential diagnosis">
              <option value="pcl5">PCL-5 | PTSD symptoms</option>
              <option value="pcptsd5">PC-PTSD-5 | Brief PTSD screen</option>
              <option value="asrs6">ASRS v1.1, 6-item | Adult ADHD screen</option>
            </optgroup>
            <optgroup label="Neurodevelopmental and personality screening">
              <option value="aq10">AQ-10 | Adult Autism Spectrum screen</option>
              <option value="msibpd">MSI-BPD | Borderline Personality screen</option>
            </optgroup>
            <optgroup label="Substance, eating, and functional concerns">
              <option value="auditc">AUDIT-C | Alcohol screen (Level 2 Substance)</option>
              <option value="cageaid">CAGE-AID | Alcohol & drug screen (Level 2 Substance)</option>
              <option value="dast10">DAST-10 | Drug use screen (Level 2 Drug)</option>
              <option value="scoff">SCOFF | Eating disorder screen</option>
              <option value="whodas12">WHODAS 2.0, 12-item | Functioning</option>
            </optgroup>
            <option value="library">Source Library & Citations</option>
          </select>
        </div>
      </div>
      <div class="screen-share-banner">
        Screen Share Mode Active
      </div>
    </div>

    <!-- Workspace Grid -->
    <div class="layout-grid">

      <!-- Main Instrument Panel -->
      <main class="panel-card">
        <div class="meta-row" style="grid-template-columns: 1fr;">
          <div>
            <label class="field-label" for="adminDate">Administration Date</label>
            <input id="adminDate" type="date">
          </div>
        </div>

        <div id="assessmentArea"></div>
      </main>

      <!-- Sticky EMR Summary Side Panel -->
      <aside class="panel-card sticky-panel summary-card">
        <h3 class="summary-header-title">EMR Summary & Real-Time Score</h3>

        <div class="result-display-box">
          <div id="scoreText" class="score-value">Incomplete</div>
          <div id="severityText" class="severity-text">Complete all required fields.</div>
          <div id="flagText" class="flag-box hidden"></div>
        </div>

        <div class="summary-options">
          <label><input id="includeResponses" type="checkbox" checked> Include item responses</label>
          <label><input id="includeInterpretation" type="checkbox" checked> Include clinical interpretation</label>
        </div>

        <textarea id="summary" readonly placeholder="Complete assessment items to generate EMR text..."></textarea>

        <div class="action-buttons">
          <button id="copyBtn" class="btn btn-primary" type="button">📋 Copy Summary</button>
          <button id="selectBtn" class="btn btn-outline" type="button">Select Text</button>
        </div>

        <div id="status" class="status-msg" aria-live="polite"></div>
      </aside>

    </div>
  </div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
  const SMARTEMR_THEME_MESSAGE = "smartemr-theme";
  const responseState = {};
  let currentKey = "phq9";

  function applySmartEmrTheme(theme) {
    const activeTheme = theme === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = activeTheme;
  }

  window.addEventListener("message", (event) => {
    const isParentMessage =
      window.parent === window ? event.source === window : event.source === window.parent;
    const expectedOrigin = window.location.origin;
    const isExpectedOrigin = !event.origin || expectedOrigin === "null" || event.origin === expectedOrigin;
    const theme = event.data?.theme;

    if (
      !isParentMessage ||
      !isExpectedOrigin ||
      event.data?.type !== SMARTEMR_THEME_MESSAGE ||
      (theme !== "light" && theme !== "dark")
    ) {
      return;
    }

    applySmartEmrTheme(theme);
  });

  applySmartEmrTheme(
    typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light"
  );

  const sourceLibrary = {
    phq9:{name:"PHQ-9", status:"Reproduction permitted", url:"https://www.phqscreeners.com/images/sites/g/files/g10060481/f/201412/PHQ-9_English.pdf", note:"Pfizer made PHQ instruments available without copyright restriction and at no charge. Preserve attribution."},
    gad7:{name:"GAD-7", status:"Reproduction permitted", url:"https://integrationacademy.ahrq.gov/sites/default/files/2020-07/GAD-7.pdf", note:"The PHQ/GAD family is available for reproduction, translation, display, and distribution with attribution."},
    cssrs:{name:"C-SSRS Screen Version", status:"Clinical use available; commercial integration should be confirmed", url:"https://www.cms.gov/files/document/cssrs-screen-version-instrument.pdf", note:"This implementation follows the user-supplied CMS form and skip logic. Confirm Columbia Lighthouse licensing and training requirements before product release."},
    whodas12:{name:"WHODAS 2.0, 12-item", status:"WHO instrument; confirm product licensing", url:"https://www.psychiatry.org/File%20Library/Psychiatrists/Practice/DSM/APA_DSM5_WHODAS-2-Self-Administered.pdf", note:"WHO publishes the instrument and simple scoring guidance. Confirm authorization for commercial software distribution."},
    pcl5:{name:"PCL-5", status:"Public domain", url:"https://www.ptsd.va.gov/professional/assessment/documents/PCL5_Standard_form.pdf", note:"Developed by the VA National Center for PTSD. Use by qualified clinicians; a positive score is not a standalone diagnosis."},
    pcptsd5:{name:"PC-PTSD-5", status:"Public domain", url:"https://www.ptsd.va.gov/professional/assessment/documents/pc-ptsd5-screen.pdf", note:"The VA states that this measure is public domain and not copyrighted."},
    asrs6:{name:"ASRS v1.1, 6-question screener", status:"Free use with required notice; do not alter", url:"https://add.org/wp-content/uploads/2015/03/adhd-questionnaire-ASRS111.pdf", note:"Harvard states that the 6-question v1.1 screener may be recreated electronically if unchanged and the copyright notice/citation are retained."},
    auditc:{name:"AUDIT-C", status:"WHO-derived; confirm product attribution/licensing", url:"https://nida.nih.gov/sites/default/files/files/AUDIT.pdf", note:"AUDIT-C uses the first three AUDIT items. Thresholds vary by setting and population."},
    dast10:{name:"DAST-10", status:"Noncommercial reproduction allowed with credit; commercial permission needed", url:"https://www.asam.org/docs/default-source/education-docs/drug-abuse-screening-test_dast10_8-28-2017.pdf", infoUrl:"https://nida.nih.gov/nidamed-medical-health-professionals/screening-tools-resources/chart-screening-tools", note:"NIDA directs users to the copyright holder. The prototype includes the scoring workflow; obtain commercial authorization before release."},
    epds:{name:"Edinburgh Postnatal Depression Scale (EPDS)", status:"Reproduction permitted with credit", url:"https://www.perinatology.com/calculators/Edinburgh%20Depression%20Scale.htm", note:"Cox, Holden, & Sagovsky (1987). Widely available for clinical screening; retain copyright/attribution statement."},
    aq10:{name:"AQ-10 (Autism Spectrum Quotient 10-Item)", status:"Open access / free clinical use", url:"https://www.autismresearchcentre.com/tests/autism-spectrum-quotient-10-items-aq-10-adult/", note:"Developed by Allison, Auyeung, & Baron-Cohen (2012). Recommended by UK NICE guidelines for initial adult autism screening."},
    scoff:{name:"SCOFF Questionnaire", status:"Open clinical use with credit", url:"https://www.nationaleatingdisorders.org/", note:"Morgan, Reid, & Lacey (1999). 5-item screening tool for eating disorders."},
    msibpd:{name:"McLean Screening Instrument for BPD (MSI-BPD)", status:"Noncommercial clinical use permitted with attribution", url:"https://pubmed.ncbi.nlm.nih.gov/14686459/", note:"Zanarini et al. (2003). 10-item screening tool for Borderline Personality Disorder features."},
    phq15:{name:"PHQ-15 (Somatic Symptom Scale)", status:"Reproduction permitted", url:"https://www.phqscreeners.com/", note:"Pfizer made PHQ instruments available without copyright restriction and at no charge. Preserve attribution."},
    cageaid:{name:"CAGE-AID Questionnaire", status:"Public domain / open clinical use", url:"https://www.hiv.uw.edu/page/substance-use/cage-aid", note:"Adapted from Ewing (1984) by Brown & Rounds (1995) to include both alcohol and drug use."},
    dsm5level1:{name:"DSM-5-TR Level 1 Adult Cross-Cutting Symptom Measure", status:"Reproduction permitted for clinical/educational use", url:"https://www.psychiatry.org/getmedia/e0b4b299-95b3-407b-b8c2-caa871ca218d/APA-DSM5TR-Level1MeasureAdult.pdf", note:"American Psychiatric Association (APA). 23-item broadband multi-domain screener across 13 psychiatric domains."},
    phq4:{name:"PHQ-4 (Patient Health Questionnaire-4)", status:"Reproduction permitted", url:"https://www.phqscreeners.com/", note:"Kroenke, Spitzer, Williams, & Lowe (2009). 4-item ultra-brief transdiagnostic screener combining PHQ-2 and GAD-2."},
    k6:{name:"Kessler 6 Psychological Distress Scale (K6)", status:"Public domain", url:"https://pubmed.ncbi.nlm.nih.gov/12457677/", note:"Kessler et al. (2002). Broadband 6-item general psychiatric distress screener for Serious Mental Illness (SMI) risk."},
    dass21:{name:"Depression Anxiety Stress Scales-21 (DASS-21)", status:"Public domain / Open access", url:"https://www.psychology.org.au/", note:"Lovibond & Lovibond (1995). 21-item transdiagnostic symptom inventory evaluating Depression, Anxiety, and Stress subscales."},
    pq16:{name:"Prodromal Questionnaire-16 (PQ-16)", status:"Open access clinical screener", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3449336/", note:"Ising et al. (2012). 16-item screener for attenuated psychosis symptoms and psychosis risk."},
    dsm5level2_depression:{name:"DSM-5 Level 2 — Depression (PROMIS)", status:"Reproduction permitted for clinical/educational use", url:"https://www.psychiatry.org/getmedia/4326c940-f414-4f2c-acec-bd8299a3cf14/APA-DSM5TR-Level2DepressionAdult.pdf", note:"PROMIS Emotional Distress - Depression - Short Form (8a). Administered when Level 1 Depression domain threshold is met."},
    dsm5level2_anxiety:{name:"DSM-5 Level 2 — Anxiety (PROMIS)", status:"Reproduction permitted for clinical/educational use", url:"https://www.psychiatry.org/getmedia/f284f967-ed9e-4754-99fc-b32765b1c4a0/APA-DSM5TR-Level2AnxietyAdult.pdf", note:"PROMIS Emotional Distress - Anxiety - Short Form (7a). Administered when Level 1 Anxiety domain threshold is met."},
    dsm5level2_anger:{name:"DSM-5 Level 2 — Anger (PROMIS)", status:"Reproduction permitted for clinical/educational use", url:"https://www.psychiatry.org/getmedia/a56cc2a0-3818-4975-bbcb-4a047e1ffbea/APA-DSM5TR-Level2AngerAdult.pdf", note:"PROMIS Emotional Distress - Anger - Short Form (5a). Administered when Level 1 Anger domain threshold is met."},
    dsm5level2_mania:{name:"DSM-5 Level 2 — Mania (Altman ASRMS)", status:"Reproduction permitted for clinical/educational use", url:"https://www.psychiatry.org/getmedia/c1783d55-268a-47b2-9932-a549b21c8d64/APA-DSM5TR-Level2ManiaAdult.pdf", note:"Altman Self-Rating Mania Scale (ASRMS). 5-item scale administered when Level 1 Mania domain threshold is met (cutoff ≥ 6)."},
    dsm5level2_sleep:{name:"DSM-5 Level 2 — Sleep Disturbance (PROMIS)", status:"Reproduction permitted for clinical/educational use", url:"https://www.psychiatry.org/getmedia/c606b335-f087-4358-9c8d-f233313d9d04/APA-DSM5TR-Level2SleepDisturbanceAdult.pdf", note:"PROMIS Sleep Disturbance - Short Form (8a). Administered when Level 1 Sleep domain threshold is met."},
    psc17:{name:"Pediatric Symptom Checklist-17 (PSC-17)", status:"Public domain / free clinical use", url:"https://pubmed.ncbi.nlm.nih.gov/17581453/", note:"Jellinek et al. (Mass General / Harvard). 17-item pediatric/youth behavioral health screener (Internalizing, Externalizing, Attention)."},
    crafft21:{name:"CRAFFT 2.1 Adolescent Substance Screener", status:"Open access for clinical use with credit", url:"https://crafft.org/", note:"Knight et al. (Center for Adolescent Behavioral Health, Boston Children's Hospital). 6-item screener for adolescent alcohol/drug risk."},
    gds15:{name:"Geriatric Depression Scale (GDS-15)", status:"Public domain", url:"https://www.apa.org/pi/aging/resources/", note:"Yesavage et al. (1986). 15-item depression screening tool validated for older adults, omitting physical somatic overlap."},
    ucla3:{name:"UCLA Loneliness Scale (3-Item Short Form)", status:"Open access / free clinical use", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC2394670/", note:"Hughes et al. (2004). 3-item screener measuring social isolation and loneliness."},
    ad8:{name:"AD8 Dementia Screening Interview", status:"Open access / free clinical use with credit", url:"https://alzheimer.wustl.edu/", note:"Galvin et al. (Washington University School of Medicine). 8-item informant/self-report cognitive impairment screener."}
  };

  const scales = {
    phq9:{
      title:"Patient Health Questionnaire-9 (PHQ-9)",
      purpose:"Depressive symptom screening and severity monitoring. Supports, but does not independently establish, a depressive disorder diagnosis.",
      instructions:"Over the last 2 weeks, how often has the client been bothered by the following problems?",
      timeframe:"Past 2 weeks",
      items:[
        "Little interest or pleasure in doing things",
        "Feeling down, depressed, or hopeless",
        "Trouble falling or staying asleep, or sleeping too much",
        "Feeling tired or having little energy",
        "Poor appetite or overeating",
        "Feeling bad about yourself, or that you are a failure or have let yourself or your family down",
        "Trouble concentrating on things, such as reading the newspaper or watching television",
        "Moving or speaking so slowly that other people could have noticed? Or the opposite—being so fidgety or restless that you have been moving around a lot more than usual",
        "Thoughts that you would be better off dead, or of hurting yourself in some way"
      ],
      options:[["Not at all",0],["Several days",1],["More than half the days",2],["Nearly every day",3]],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const severity=total<=4?"Minimal or no depression":total<=9?"Mild depression":total<=14?"Moderate depression":total<=19?"Moderately severe depression":"Severe depression";
        const flag=values[8]>0?"Item 9 endorsed (thoughts of self-harm or being better off dead). Perform and document a comprehensive suicide risk assessment.":"";
        return {score:`${total}/27`,severity,flag,total};
      }
    },
    gad7:{
      title:"Generalized Anxiety Disorder-7 (GAD-7)",
      purpose:"Anxiety symptom screening and severity monitoring.",
      instructions:"Over the last 2 weeks, how often has the client been bothered by the following problems?",
      timeframe:"Past 2 weeks",
      items:[
        "Feeling nervous, anxious, or on edge",
        "Not being able to stop or control worrying",
        "Worrying too much about different things",
        "Trouble relaxing",
        "Being so restless that it is hard to sit still",
        "Becoming easily annoyed or irritable",
        "Feeling afraid as if something awful might happen"
      ],
      options:[["Not at all",0],["Several days",1],["More than half the days",2],["Nearly every day",3]],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const severity=total<=4?"Minimal anxiety":total<=9?"Mild anxiety":total<=14?"Moderate anxiety":"Severe anxiety";
        return {score:`${total}/21`,severity,flag:total>=10?"Score of 10 or higher is a common clinical threshold for further diagnostic evaluation.":"",total};
      }
    },
    whodas12:{
      title:"WHODAS 2.0 (12-item Self-Administered)",
      purpose:"General disability and functional impairment assessment across major life domains.",
      instructions:"In the past 30 days, how much difficulty did the client have doing the following activities?",
      timeframe:"Past 30 days",
      items:[
        "Standing for long periods such as 30 minutes?",
        "Taking care of your household responsibilities?",
        "Learning a new task (e.g., learning how to get to a new place)?",
        "How much of a problem did you have in joining in community activities?",
        "How much have you been emotionally affected by your health problems?",
        "Concentrating on doing something for ten minutes?",
        "Walking a long distance such as a kilometer (or half a mile)?",
        "Washing your whole body?",
        "Getting dressed?",
        "Dealing with people you do not know?",
        "Maintaining a friendship?",
        "Your day-to-day work?"
      ],
      options:[["None",0],["Mild",1],["Moderate",2],["Severe",3],["Extreme or cannot do",4]],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const pct=((total/48)*100).toFixed(1);
        const severity=total<=12?"Mild functional difficulty":total<=24?"Moderate functional difficulty":total<=36?"Severe functional difficulty":"Extreme functional difficulty";
        return {score:`${total}/48 (${pct}% raw disability score)`,severity,flag:total>=25?"High level of reported functional impairment across daily living domains.":"",total};
      }
    },
    pcl5:{
      title:"PTSD Checklist for DSM-5 (PCL-5)",
      purpose:"Assesses DSM-5 PTSD symptom severity.",
      instructions:"In the past month, how much has the client been bothered by the following problems related to a stressful experience?",
      timeframe:"Past month",
      traumaGate:true,
      items:[
        "Repeated, disturbing, and unwanted memories of the stressful experience?",
        "Repeated, disturbing dreams of the stressful experience?",
        "Suddenly feeling or acting as if the stressful experience were actually happening again?",
        "Feeling very upset when something reminded you of the stressful experience?",
        "Having strong physical reactions when something reminded you of the stressful experience?",
        "Avoiding memories, thoughts, or feelings related to the stressful experience?",
        "Avoiding external reminders of the stressful experience (e.g., people, places, conversations)?",
        "Trouble remembering important parts of the stressful experience?",
        "Having strong negative beliefs about yourself, other people, or the world?",
        "Blaming yourself or someone else for the stressful experience or what happened after it?",
        "Having strong negative feelings such as fear, horror, anger, guilt, or shame?",
        "Loss of interest in activities that you used to enjoy?",
        "Feeling distant or cut off from other people?",
        "Trouble experiencing positive feelings?",
        "Irritable behavior, angry outbursts, or acting aggressively?",
        "Taking too many risks or doing things that could cause you harm?",
        "Being 'superalert' or watchful or on guard?",
        "Feeling jumpy or easily startled?",
        "Having difficulty concentrating?",
        "Trouble falling or staying asleep?"
      ],
      options:[["Not at all",0],["A little bit",1],["Moderately",2],["Quite a bit",3],["Extremely",4]],
      calculate(values,extra){
        if(extra.traumaExposure==="no") return {score:"0/80 (No Criterion A trauma reported)",severity:"Trauma exposure criterion not reported on screener gate.",flag:""};
        const total=values.reduce((a,b)=>a+b,0);
        const provisionalCutoff=31;
        const severity=total>=provisionalCutoff?"Provisional PTSD threshold met (Score ≥ 31)":"Below provisional PTSD threshold (Score < 31)";
        return {score:`${total}/80`,severity,flag:total>=provisionalCutoff?"PCL-5 score meets or exceeds the provisional clinical cutoff (31-33). Comprehensive trauma clinical evaluation indicated.":"",total};
      }
    },
    pcptsd5:{
      title:"Primary Care PTSD Screen for DSM-5 (PC-PTSD-5)",
      purpose:"Brief 5-item PTSD screener for primary care and general clinical intake.",
      instructions:"If the client has experienced a traumatic event, answer the following questions regarding the past month.",
      timeframe:"Past month",
      traumaGate:true,
      items:[
        "Had nightmares about the event(s) or thought about the event(s) when you did not want to?",
        "Tried hard not to think about the event(s) or went out of your way to avoid situations that reminded you of the event(s)?",
        "Been constantly on guard, watchful, or easily startled?",
        "Felt numb or detached from people, activities, or your surroundings?",
        "Felt guilty or unable to stop blaming yourself or others for the event(s) or any problems the event(s) may have caused?"
      ],
      options:[["No",0],["Yes",1]],
      calculate(values,extra){
        if(extra.traumaExposure==="no") return {score:"0/5 (No traumatic event reported)",severity:"Trauma exposure screen negative.",flag:""};
        const total=values.reduce((a,b)=>a+b,0);
        const positive=total>=3;
        return {score:`${total}/5`,severity:positive?"Positive PTSD screen (Score ≥ 3)":"Negative PTSD screen (Score < 3)",flag:positive?"A score of 3 or higher indicates a positive PC-PTSD-5 screen. Administer full PCL-5 or conduct a structured clinical interview.":"",total};
      }
    },
    asrs6:{
      title:"Adult ADHD Self-Report Scale (ASRS v1.1) 6-Question Screener",
      purpose:"Brief 6-question screener for adult ADHD symptoms.",
      instructions:"Answer the questions below based on how the client has felt and conducted themselves over the past 6 months.",
      timeframe:"Past 6 months",
      items:[
        "How often does the client have trouble wrapping up the final details of a project, once the challenging parts have been done?",
        "How often does the client have difficulty getting things in order when operating a task that requires organization?",
        "How often does the client have problems remembering appointments or obligations?",
        "When the client has a task that requires a lot of thought, how often do they avoid or delay getting started?",
        "How often does the client fidget or squirm with their hands or feet when they have to sit down for a long time?",
        "How often does the client feel overly active and compelled to do things, like they were driven by a motor?"
      ],
      options:[["Never",0],["Rarely",1],["Sometimes",2],["Often",3],["Very often",4]],
      calculate(values){
        const significantThresholds=[2,2,2,3,3,3];
        let shadedCount=0;
        values.forEach((val,idx)=>{ if(val>=significantThresholds[idx]) shadedCount++; });
        const positive=shadedCount>=4;
        const severity=positive?`Positive screener result (${shadedCount}/6 items in shaded zone)`:`Negative screener result (${shadedCount}/6 items in shaded zone)`;
        return {score:`${shadedCount}/6 shaded responses`,severity,flag:positive?"Four or more responses are in the WHO screener shaded zone. Complete clinical evaluation for adult ADHD is recommended.":"",total:shadedCount};
      }
    },
    auditc:{
      title:"Alcohol Use Disorders Identification Test-Concise (AUDIT-C)",
      purpose:"Brief 3-item alcohol screening tool to identify hazardous drinking or active alcohol use disorders.",
      instructions:"Answer the questions based on alcohol consumption patterns over the past year.",
      timeframe:"Past year",
      customItems:[
        {prompt:"How often does the client have a drink containing alcohol?", options:[["Never",0],["Monthly or less",1],["2-4 times a month",2],["2-3 times a week",3],["4 or more times a week",4]]},
        {prompt:"How many drinks containing alcohol does the client have on a typical day when drinking?", options:[["1 or 2",0],["3 or 4",1],["5 or 6",2],["7 to 9",3],["10 or more",4]]},
        {prompt:"How often does the client have 5 or more drinks on one occasion?", options:[["Never",0],["Less than monthly",1],["Monthly",2],["Weekly",3],["Daily or almost daily",4]]}
      ],
      calculate(values){
        const total=values.reduce((a,b)=>a+b,0);
        const severity=total>=4?"Positive screen for hazardous drinking (Score ≥ 4 / ≥3 depending on risk profile)":"Negative screen for hazardous drinking";
        return {score:`${total}/12`,severity,flag:total>=4?"AUDIT-C score meets or exceeds general thresholds for hazardous drinking. Provide brief counseling and evaluate full AUDIT scale.":"",total};
      }
    },
    dast10:{
      title:"Drug Abuse Screening Test-10 (DAST-10)",
      purpose:"Brief 10-item tool assessing drug use problems (excluding alcohol and tobacco).",
      instructions:"These questions refer to the past 12 months. Answer Yes or No.",
      timeframe:"Past 12 months",
      items:[
        "Has the client used drugs other than those required for medical reasons?",
        "Does the client abuse more than one drug at a time?",
        "Is the client always able to stop using drugs when they want to? (Reversed)",
        "Has the client had 'blackouts' or 'flashbacks' as a result of drug use?",
        "Does the client ever feel bad or guilty about their drug use?",
        "Does the client's spouse (or parents) ever complain about their involvement with drugs?",
        "Has the client neglected their family because of their use of drugs?",
        "Has the client engaged in illegal acts in order to obtain drugs?",
        "Has the client ever experienced withdrawal symptoms (felt sick) when they stopped taking drugs?",
        "Has the client had medical problems as a result of their drug use (e.g., memory loss, hepatitis, convulsions, bleeding)?"
      ],
      options:[["No",0],["Yes",1]],
      calculate(values){
        const rawValues=values.map((v,i)=>i===2?(v===1?0:1):v);
        const total=rawValues.reduce((a,b)=>a+b,0);
        let severity="No problem reported (0)";
        if(total>=1&&total<=2) severity="Low level / Monitor (1-2)";
        else if(total>=3&&total<=5) severity="Moderate level / Investigation recommended (3-5)";
        else if(total>=6&&total<=8) severity="Substantial level / Intensive assessment recommended (6-8)";
        else if(total>=9) severity="Severe level / Intensive assessment and intervention required (9-10)";
        return {score:`${total}/10`,severity,flag:total>=3?"DAST-10 score indicates moderate to severe drug-related problems. Detailed substance evaluation recommended.":"",total};
      }
    },
    epds:{
      title:"Edinburgh Postnatal Depression Scale (EPDS)",
      purpose:"Perinatal and postpartum depression screening tool.",
      instructions:"Select the response that best describes how the client felt over the past 7 days.",
      timeframe:"Past 7 days",
      customItems:[

    dsm5level1:{
      title:"DSM-5-TR Level 1 Adult Cross-Cutting Symptom Measure",
      purpose:"Broadband multidomain mental health screener evaluating 13 psychiatric domains to identify symptoms requiring in-depth Level 2 follow-up.",
      instructions:"During the PAST TWO (2) WEEKS, how much has the client been bothered by any of the following problems?",
      timeframe:"Past 2 weeks",
      items:[
        "[Depression] Little interest or pleasure in doing things?",
        "[Depression] Feeling down, depressed, or hopeless?",
        "[Anger] Feeling more annoyed, irritable, or angry than usual?",
        "[Mania] Feeling less sleep needed than usual?",
        "[Mania] Starting many more projects than usual or doing unusual/risky things?",
        "[Anxiety] Feeling nervous, anxious, frightened, worried, or on edge?",
        "[Anxiety] Feeling panic or being frightened?",
        "[Anxiety] Avoiding situations that make you anxious?",
        "[Somatic] Unexplained aches and pains (e.g. head, back, joints, abdomen)?",
        "[Somatic] Feeling your illnesses are not being taken seriously enough?",
        "[Suicidal Ideation] Thoughts of hurting yourself or that you would be better off dead?",
        "[Psychosis] Hearing things or seeing things that other people cannot hear or see?",
        "[Psychosis] Feeling that people are reading your mind or controlling your thoughts?",
        "[Sleep] Problems with sleep quality or staying asleep?",
        "[Memory] Problems with memory (learning new info) or finding your way around?",
        "[Repetitive Thoughts] Unpleasant thoughts, urges, or images entering your mind repeatedly?",
        "[Repetitive Thoughts] Feeling driven to perform certain behaviors or mental acts over and over?",
        "[Dissociation] Feeling detached or distant from yourself, body, surroundings, or memories?",
        "[Personality] Feeling that you don't know who you really are or what you want out of life?",
        "[Personality] Feeling not close to other people or unable to enjoy relationships?",
        "[Substance Use] Drinking alcohol or using drugs more than intended?",
        "[Substance Use] Using prescription drugs or OTC meds in larger amounts or longer than prescribed?",
        "[Substance Use] Smoking tobacco or using nicotine products?"
      ],
      options:[["Not at all",0],["Slight",1],["Mild",2],["Moderate",3],["Severe",4]],
      calculate(values){
        const domainThresholds=[
          {name:"Depression", items:[0,1], threshold:2},
          {name:"Anger", items:[2], threshold:2},
          {name:"Mania", items:[3,4], threshold:2},
          {name:"Anxiety", items:[5,6,7], threshold:2},
          {name:"Somatic Symptoms", items:[8,9], threshold:2},
          {name:"Suicidal Ideation", items:[10], threshold:1},
          {name:"Psychosis", items:[11,12], threshold:1},
          {name:"Sleep Problems", items:[13], threshold:2},

      }
