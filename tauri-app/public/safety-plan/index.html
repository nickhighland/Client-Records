<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Safety Plan</title>
    <link href="./app/dist/output.css" rel="stylesheet">
    <style>
        /* General Body and Font Styles */
        body {
            background-color: #f3f4f6; /* bg-gray-100 */
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Styles for Safety Plan Container */
        .safety-plan-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .header-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(120px, 0.5fr) minmax(0, 1fr);
            margin-bottom: 20px;
            gap: 1rem;
            align-items: end;
        }

        .header-row > div {
            min-width: 0;
        }

        .form-label {
            font-weight: bold;
            display: block;
            margin-bottom: 0.5rem;
        }

        input[type="text"], input[type="date"] {
            border: 1px solid #000000;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 680px) {
            .header-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .dynamic-input, .three-col-input, .additional-resource-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }

        .dynamic-input input[type="text"], .three-col-input input[type="text"], .additional-resource-row input[type="text"] {
            flex: 1;
        }

        .three-col-input .name-field { flex-basis: 40%; }
        .three-col-input .phone-field { flex-basis: 35%; }
        .three-col-input .ext-field { flex-basis: 15%; }

        .additional-resource-row input:first-child { flex: 0 1 40%; }
        .additional-resource-row input:last-of-type { flex: 1 1 60%; }

        .dynamic-input button, .three-col-input button, .additional-resource-row button {
            padding: 4px 8px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            cursor: pointer;
            border-radius: 4px;
        }

        .checkbox-group label {
            display: block;
            margin-bottom: 0.5rem;
        }

        .checkbox-group input {
            margin-right: 8px;
        }

        .no-pdf {
            color: #555;
            font-style: italic;
            font-size: 0.9em;
            margin-top: 4px;
            margin-bottom: 15px;
        }

        #saveBtn {
            margin-top: 20px;
            padding: 10px 15px;
            font-size: 16px;
        }

        .save-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .save-status {
            min-height: 1.4em;
            color: var(--smart-muted, #7f8c8d);
            font-size: 0.95rem;
        }

        .save-status[data-state="success"] {
            color: #218c5a;
        }

        .save-status[data-state="error"] {
            color: #c0392b;
        }

        :root {
            --smart-bg-main: #f7f9fc;
            --smart-panel-bg: #ffffff;
            --smart-input-bg: #ffffff;
            --smart-text: #2c3e50;
            --smart-muted: #7f8c8d;
            --smart-border: #dbe3eb;
            --smart-accent: #3498db;
            --smart-accent-dark: #2980b9;
            --smart-header: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            --smart-subtle: #eef3f7;
        }

        [data-theme="dark"] {
            --smart-bg-main: #2d3748;
            --smart-panel-bg: #283141;
            --smart-input-bg: #4a5568;
            --smart-text: #e2e8f0;
            --smart-muted: #a0aec0;
            --smart-border: #4a5568;
            --smart-accent: #63b3ed;
            --smart-accent-dark: #3498db;
            --smart-header: linear-gradient(135deg, #1a2533 0%, #0f172a 100%);
            --smart-subtle: #232b38;
            color-scheme: dark;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background: var(--smart-bg-main);
            color: var(--smart-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 14px;
        }

        .safety-plan-container {
            background: var(--smart-panel-bg);
            border: 1px solid var(--smart-border);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.14);
        }

        h1,
        .form-label {
            color: var(--smart-text);
        }

        input[type="text"],
        input[type="date"] {
            background: var(--smart-input-bg);
            border-color: var(--smart-border);
            color: var(--smart-text);
        }

        input::placeholder {
            color: var(--smart-muted);
        }

        .dynamic-input button,
        .three-col-input button,
        .additional-resource-row button {
            border-color: var(--smart-border);
            background: var(--smart-subtle);
            color: var(--smart-text);
        }

        .no-pdf {
            color: var(--smart-muted);
        }

        #saveBtn {
            border: 0;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--smart-accent) 0%, var(--smart-accent-dark) 100%);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.28);
            margin-top: 0;
        }

        #saveBtn:hover {
            filter: brightness(1.06);
        }

        #saveBtn:disabled {
            cursor: wait;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="SafetyPlan">
        <div class="safety-plan-container">
            <h1 class="text-4xl font-bold text-center mb-6">Safety Plan</h1>
            <div class="header-row">
                <div>
                    <label class="form-label" for="patientName">Patient Name:</label>
                    <input id="patientName" name="patientName" type="text">
                </div>
                <div>
                    <label class="form-label" for="planDate">Date:</label>
                    <input id="planDate" name="planDate" type="date">
                </div>
                <div>
                    <label class="form-label" for="createdWith">Created with help from:</label>
                    <input id="createdWith" name="createdWith" type="text">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Warning signs (thoughts, images, mood, situation, behavior) that a crisis may be developing:</label>
                <div id="warningSignsList"></div>
            </div>

            <div class="form-group">
            <label class="form-label">Internal coping strategies - Things I can do to take my mind off my problems without contacting another person (relaxation techniques, physical activities, distractions):</label>
                <div id="copingStrategiesList"></div>
            </div>

            <div class="form-group">
                <label class="form-label">People who can provide distraction:</label>
                <div id="distractionPeopleList"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Social settings that can provide distraction:</label>
                <div id="socialSettingsList"></div>
            </div>

            <div class="form-group">
                <label class="form-label">People whom I can ask for help during a crisis:</label>
                <div id="helpPeopleList"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Professionals or agencies I can contact for help:</label>
                <div id="professionalHelpList"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Ways I can make my environment safe:</label>
                 <div class="no-pdf">
                    Reminder: Discuss lethal means safety: access to firearms, medications, sharp objects, safe storage, temporary removal, and supportive help.
                </div>
                <div id="safetyEnvironmentList"></div>
            </div>

            <div class="form-group checkbox-group">
                <label class="form-label">National Crisis Resources:</label>
                <label><input type="checkbox" checked> <strong>Emergency Services / Local ER:</strong> Call 911 or go to nearest Hospital Emergency Department</label>
                <label><input type="checkbox" checked> <strong>Suicide & Crisis Lifeline:</strong> Call or text 988 (Available 24/7)</label>
                <label><input type="checkbox"> <strong>Veterans Crisis Line:</strong> 988, Option 1 (or text 838255)</label>
                <label><input type="checkbox" checked> <strong>Crisis Text Line:</strong> Text HOME to 741741</label>
                <label><input type="checkbox"> <strong>The Trevor Project (LGBTQ Youth):</strong> Call 1-866-488-7386 or text START to 67867</label>
                <label><input type="checkbox"> <strong>Trans Lifeline (Peer Support):</strong> Call 1-877-565-8860</label>
                <label><input type="checkbox"> <strong>Native & Strong Lifeline:</strong> Call 988, Option 4 (American Indian & Alaska Native Support)</label>
                <label><input type="checkbox"> <strong>SAMHSA National Helpline (Substance Use & Mental Health):</strong> 1-800-662-HELP (4357)</label>
                <label><input type="checkbox"> <strong>National Domestic Violence Hotline:</strong> 1-800-799-SAFE (7233) or text START to 88788</label>
                <label><input type="checkbox"> <strong>Love is Respect (Teen Dating Abuse):</strong> Call 1-866-331-9474 or text LOVEIS to 22522</label>
                <label><input type="checkbox"> <strong>RAINN National Sexual Assault Hotline:</strong> 1-800-656-4673</label>
                <label><input type="checkbox"> <strong>National Alliance on Mental Illness (NAMI Helpline):</strong> 1-800-950-NAMI (6264)</label>
                <label><input type="checkbox"> <strong>Disaster Distress Helpline:</strong> 1-800-985-5990 or text TalkWithUs to 66746</label>
                <label><input type="checkbox"> <strong>Childhelp National Child Abuse Hotline:</strong> 1-800-422-4453</label>
                <label><input type="checkbox"> <strong>National Eating Disorders Association (NEDA):</strong> 1-800-931-2237 or text NEDA to 741741</label>
            </div>

            <div class="form-group" id="additional-resources-container">
                <label class="form-label">Additional Resources:</label>
                <div id="additional-resources-list"></div>
            </div>

            <div class="save-row">
                <button id="saveBtn" class="mt-2 px-6 py-2 bg-indigo-600 text-white font-semibold rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Save as PDF...</button>
                <span id="saveStatus" class="save-status" role="status" aria-live="polite"></span>
            </div>
        </div>
    </div>

    <script src="./app/vendor/jspdf.umd.min.js"></script>
    <script>
    const { jsPDF } = window.jspdf;
    const SMARTEMR_THEME_MESSAGE = 'smartemr-theme';
    const SAFETY_PLAN_SAVE_MESSAGE = 'smartemr-safety-plan-save';
    const SAFETY_PLAN_SAVE_RESULT_MESSAGE = 'smartemr-safety-plan-save-result';
    let pendingNativeSave = null;
    let pendingNativeSaveTimeout = null;

    function applySmartEmrTheme(theme) {
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    }

    function setSaveStatus(message, state = '') {
        const status = document.getElementById('saveStatus');
        if (!status) return;
        status.textContent = message;
        if (state) {
            status.dataset.state = state;
        } else {
            delete status.dataset.state;
        }
    }

    window.addEventListener('message', (event) => {
        const isParentMessage =
            window.parent === window ? event.source === window : event.source === window.parent;
        const expectedOrigin = window.location.origin;
        const isExpectedOrigin = !event.origin || expectedOrigin === 'null' || event.origin === expectedOrigin;

        if (!isParentMessage || !isExpectedOrigin) {
            return;
        }

        if (event.data?.type === SMARTEMR_THEME_MESSAGE) {
            const theme = event.data?.theme;
            if (theme === 'light' || theme === 'dark') {
                applySmartEmrTheme(theme);
            }
            return;
        }

        if (event.data?.type === SAFETY_PLAN_SAVE_RESULT_MESSAGE && pendingNativeSave) {
            const resolve = pendingNativeSave;
            pendingNativeSave = null;
            window.clearTimeout(pendingNativeSaveTimeout);
            pendingNativeSaveTimeout = null;
            resolve(event.data);
        }
    });

    applySmartEmrTheme(
        typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
    );

    /**
     * PDF Generation Function
     */
    function requestNativeSave(filename, pdfData) {
        if (window.parent === window) {
            return Promise.resolve({ handled: false });
        }

        return new Promise((resolve) => {
            const finish = (result) => {
                if (!pendingNativeSave) return;
                pendingNativeSave = null;
                window.clearTimeout(pendingNativeSaveTimeout);
                pendingNativeSaveTimeout = null;
                resolve(result);
            };

            pendingNativeSave = finish;
            pendingNativeSaveTimeout = window.setTimeout(
                () => finish({ handled: false }),
                10000
            );

            const targetOrigin = window.location.origin && window.location.origin !== 'null'
                ? window.location.origin
                : '*';

            try {
                window.parent.postMessage(
                    { type: SAFETY_PLAN_SAVE_MESSAGE, filename, bytes: pdfData },
                    targetOrigin
                );
            } catch (error) {
                finish({ handled: false, error: error?.message || String(error) });
            }
        });
    }

    function savePdfInBrowser(pdfData, suggestedFilename) {
        const requestedName = window.prompt('Name this Safety Plan PDF', suggestedFilename);
        if (requestedName === null) {
            return { cancelled: true };
        }

        const trimmedName = requestedName.trim();
        if (!trimmedName) {
            return { cancelled: true };
        }

        const filename = /\.pdf$/i.test(trimmedName) ? trimmedName : `${trimmedName}.pdf`;
        const blob = new Blob([pdfData], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        return { ok: true, filename };
    }

    async function generatePDF() {
        const saveButton = document.getElementById('saveBtn');
        if (saveButton) saveButton.disabled = true;
        setSaveStatus('Preparing PDF...');

        try {
        const doc = new jsPDF();
        const pageHeight = doc.internal.pageSize.height;
        const pageWidth = doc.internal.pageSize.width;
        const margin = 15;
        let y = 20; // Initial Y position
        const headerFontSize = 21;
        const bodyFontSize = 11;
        const lineHeight = 5;

        function checkPageBreak(requiredHeight) {
            if (y + requiredHeight >= pageHeight - margin) {
                doc.addPage();
                y = margin;
            }
        }

        function drawLines(lines, x, startY, options = {}) {
            lines.forEach((line, index) => {
                doc.text(line, x, startY + (index * lineHeight), options);
            });
        }

        doc.setFontSize(headerFontSize);
        doc.setFont(undefined, 'bold');
        doc.text("Safety Plan", pageWidth / 2, y, { align: 'center' });
        y += 12;

        const patientNameRaw = document.getElementById('patientName').value || '';
        const patientName = `Patient Name: ${patientNameRaw || 'N/A'}`;
        let planDateStr = "N/A";
        const dateValue = document.getElementById('planDate').value;
        if (dateValue) {
            const [year, month, day] = dateValue.split('-');
            planDateStr = `${month}-${day}-${year}`;
        }
        const planDate = `Date: ${planDateStr}`;
        const createdWith = `Created with help from: ${document.getElementById('createdWith').value || 'N/A'}`;

        doc.setFontSize(bodyFontSize);
        doc.setFont(undefined, 'normal');
        const headerGap = 7;
        const headerColumnWidth = (pageWidth - (margin * 2) - (headerGap * 2)) / 3;
        const headerColumns = [
            { text: patientName, x: margin },
            { text: planDate, x: margin + headerColumnWidth + headerGap },
            { text: createdWith, x: margin + ((headerColumnWidth + headerGap) * 2) }
        ];
        const headerLines = headerColumns.map(({ text }) => doc.splitTextToSize(text, headerColumnWidth));
        const headerHeight = Math.max(...headerLines.map(lines => lines.length)) * lineHeight;
        checkPageBreak(headerHeight);
        headerLines.forEach((lines, index) => drawLines(lines, headerColumns[index].x, y));
        y += headerHeight + 5;

        document.querySelectorAll('.form-group').forEach(group => {
            const label = group.querySelector('.form-label');

            // Check if this is the Additional Resources section
            let hasContent = true;
            if (group.id === 'additional-resources-container') {
                const additionalResources = document.querySelectorAll('#additional-resources-list .additional-resource-row');
                hasContent = Array.from(additionalResources).some(row => {
                    const nameInput = row.querySelector('input:first-child');
                    return nameInput && nameInput.value.trim();
                });
            }

            if (label && hasContent) {
                doc.setFontSize(bodyFontSize);
                doc.setFont(undefined, 'bold');
                const labelLines = doc.splitTextToSize(label.textContent.trim(), pageWidth - (margin * 2));
                const labelHeight = labelLines.length * lineHeight;
                checkPageBreak(labelHeight);
                drawLines(labelLines, margin, y);
                y += labelHeight + 1;
            }

            const threeColInputs = group.querySelectorAll('.three-col-input');
            if (threeColInputs.length > 0) {
                 const col1x = margin + 5, col2x = 90, col3x = 145;
                 const col1Width = col2x - col1x - 2, col2Width = col3x - col2x - 2, col3Width = pageWidth - col3x - margin;

                 if (Array.from(threeColInputs).some(input => input.querySelector('.name-field').value)) {
                     doc.setFontSize(bodyFontSize);
                     doc.setFont(undefined, 'bold');
                     doc.text("Name", col1x, y);
                     doc.text("Phone", col2x, y);
                     doc.text("Extension", col3x, y);
                     y += 5;
                 }

                 doc.setFontSize(bodyFontSize);
                 doc.setFont(undefined, 'normal');
                 threeColInputs.forEach(inputWrapper => {
                     const name = inputWrapper.querySelector('.name-field').value;
                     const phone = inputWrapper.querySelector('.phone-field').value;
                     const ext = inputWrapper.querySelector('.ext-field').value;

                     if (name || phone || ext) {
                         const nameLines = doc.splitTextToSize(name, col1Width);
                         const phoneLines = doc.splitTextToSize(phone, col2Width);
                         const extLines = doc.splitTextToSize(ext, col3Width);

                         const linesRequired = Math.max(nameLines.length, phoneLines.length, extLines.length);
                         const heightRequired = linesRequired * lineHeight;
                         checkPageBreak(heightRequired);

                         drawLines(nameLines, col1x, y);
                         drawLines(phoneLines, col2x, y);
                         drawLines(extLines, col3x, y);

                         y += heightRequired + 1;
                     }
                 });
            }

            const singleInputs = group.querySelectorAll('.dynamic-input input[type="text"]');
            if (singleInputs.length > 0) {
                doc.setFont(undefined, 'normal');
                singleInputs.forEach(input => {
                     if (input.value.trim() !== '') {
                         const line = `- ${input.value}`;
                         const splitText = doc.splitTextToSize(line, pageWidth - (margin * 2) - 5);
                         const heightRequired = splitText.length * lineHeight;
                         checkPageBreak(heightRequired);
                         drawLines(splitText, margin + 5, y);
                         y += heightRequired + 1;
                     }
                 });
            }

            if (group.classList.contains('checkbox-group') || group.id === 'additional-resources-container') {
                const resources = [];
                // Get static checked resources
                if (group.classList.contains('checkbox-group')) {
                    group.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                        const fullText = checkbox.parentElement.textContent.trim();
                        const parts = fullText.split(':');
                        if (parts.length >= 2) {
                             const label = parts[0].trim();
                             let value = parts.slice(1).join(':').trim().replace(/‑/g, '-');
                             resources.push({ label, value });
                        }
                    });
                }

                // Get dynamic additional resources
                if (group.id === 'additional-resources-container') {
                    document.querySelectorAll('#additional-resources-list .additional-resource-row').forEach(row => {
                        const nameInput = row.querySelector('input:first-child');
                        const contactInput = row.querySelector('input:last-of-type');
                        if (nameInput && contactInput && nameInput.value.trim()) {
                            resources.push({ label: nameInput.value.trim(), value: contactInput.value.trim() });
                        }
                    });
                }

                if (resources.length > 0) {
                    const resourceLabelX = margin + 5;
                    const col1Width = 78;
                    const col2x = resourceLabelX + col1Width + 7;
                    const col2Width = pageWidth - col2x - margin;
                    doc.setFontSize(bodyFontSize);

                    resources.forEach(resource => {
                        doc.setFont(undefined, 'bold');
                        const labelLines = doc.splitTextToSize(resource.label, col1Width);
                        doc.setFont(undefined, 'normal');
                        const valueLines = doc.splitTextToSize(resource.value, col2Width);

                        const linesRequired = Math.max(labelLines.length, valueLines.length);
                        const heightRequired = linesRequired * lineHeight;
                        checkPageBreak(heightRequired);

                        doc.setFont(undefined, 'bold');
                        drawLines(labelLines, resourceLabelX, y);
                        doc.setFont(undefined, 'normal');
                        drawLines(valueLines, col2x, y);

                        y += heightRequired + 2;
                    });
                }
            }
            y += 4;
        });

        const sanitizedName = patientNameRaw.trim().replace(/\s+/g, '_').replace(/[^A-Za-z0-9_-]/g, '');
        const fileBase = sanitizedName || 'Safety_Plan';
        const suggestedFilename = `${fileBase}_Safety_Plan.pdf`;
        const pdfData = doc.output('arraybuffer');
        const nativeResult = await requestNativeSave(suggestedFilename, pdfData);

        if (nativeResult.handled) {
            if (nativeResult.ok) {
                const savedName = nativeResult.filename || suggestedFilename;
                setSaveStatus(`Saved as ${savedName}.`, 'success');
            } else if (nativeResult.cancelled) {
                setSaveStatus('Save cancelled.');
            } else {
                setSaveStatus(nativeResult.error || 'The PDF could not be saved.', 'error');
            }
            return;
        }

        const browserResult = savePdfInBrowser(pdfData, suggestedFilename);
        if (browserResult.ok) {
            setSaveStatus(`Downloaded ${browserResult.filename}.`, 'success');
        } else {
            setSaveStatus('Save cancelled.');
        }
        } catch (error) {
            console.error('Failed to generate Safety Plan PDF:', error);
            setSaveStatus(`The PDF could not be saved: ${error?.message || String(error)}`, 'error');
        } finally {
            if (saveButton) saveButton.disabled = false;
        }
    }

    document.getElementById("saveBtn").addEventListener("click", generatePDF);

    function createPhoneRow() {
        const nameInput = document.createElement('input'); nameInput.type = 'text'; nameInput.placeholder = 'Name'; nameInput.className = 'name-field';
        const phoneInput = document.createElement('input'); phoneInput.type = 'text'; phoneInput.placeholder = 'Phone (###-###-####)'; phoneInput.className = 'phone-field';
        const extInput = document.createElement('input'); extInput.type = 'text'; extInput.placeholder = 'Extension'; extInput.className = 'ext-field';
        return [nameInput, phoneInput, extInput];
    }

    function createDynamicList(containerId, count, triple = false) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        for (let i = 0; i < count; i++) { addEntry(containerId, triple); }
    }

    function addEntry(containerId, triple = false) {
        const container = document.getElementById(containerId);
        const wrapper = document.createElement('div');
        wrapper.className = triple ? 'three-col-input' : 'dynamic-input';

        const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.textContent = '+'; addBtn.onclick = () => addEntry(containerId, triple);
        const removeBtn = document.createElement('button'); removeBtn.type = 'button'; removeBtn.textContent = '-'; removeBtn.onclick = () => removeEntry(removeBtn);

        if (triple) {
            const [name, phone, ext] = createPhoneRow();
            wrapper.append(name, phone, ext);
        } else {
            const input = document.createElement('input'); input.type = 'text';
            wrapper.appendChild(input);
        }
        wrapper.append(addBtn, removeBtn);
        container.appendChild(wrapper);
    }

    function addAdditionalResource() {
        const list = document.getElementById('additional-resources-list');
        const row = document.createElement('div');
        row.className = 'additional-resource-row';

        const nameInput = document.createElement('input'); nameInput.type = 'text'; nameInput.placeholder = 'Resource Name';
        const contactInput = document.createElement('input'); contactInput.type = 'text'; contactInput.placeholder = 'Contact Information';
        const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.textContent = '+'; addBtn.onclick = addAdditionalResource;
        const removeBtn = document.createElement('button'); removeBtn.type = 'button'; removeBtn.textContent = '-'; removeBtn.onclick = () => removeEntry(removeBtn);

        row.append(nameInput, contactInput, addBtn, removeBtn);
        list.appendChild(row);
    }

    function removeEntry(button) {
        const row = button.parentElement;
        if (row.parentElement.children.length > 1 || row.parentElement.id === 'additional-resources-list') {
            row.remove();
        }
        const list = document.getElementById('additional-resources-list');
        if (list && list.children.length === 0) {
            addAdditionalResource();
        }
    }

    document.addEventListener('input', function(e) {
        if (e.target.matches('.phone-field')) {
            const input = e.target;
            const value = input.value.replace(/\D/g, '').substring(0, 10);
            const size = value.length;
            if (size > 6) input.value = `${value.substring(0, 3)}-${value.substring(3, 6)}-${value.substring(6, 10)}`;
            else if (size > 3) input.value = `${value.substring(0, 3)}-${value.substring(3, 6)}`;
            else if (size > 0) input.value = value;
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('planDate').value = new Date().toISOString().split('T')[0];

        createDynamicList('warningSignsList', 3);
        createDynamicList('copingStrategiesList', 3);
        createDynamicList('distractionPeopleList', 2, true);
        createDynamicList('socialSettingsList', 2);
        createDynamicList('helpPeopleList', 2, true);
        createDynamicList('professionalHelpList', 2, true);
        createDynamicList('safetyEnvironmentList', 2);

        addAdditionalResource();
    });
  </script>
</body>
</html>
